<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Base -->
  <rect width="1200" height="630" fill="#0D0D0C"/>

  <!-- Top verde line -->
  <rect x="0" y="0" width="1200" height="3" fill="#00C46A"/>

  <!-- Logomark — centered -->
  <g transform="translate(515, 108)">
    <rect x="0"  y="0"  width="68" height="22" rx="4" fill="#00C46A"/>
    <rect x="26" y="30" width="68" height="22" rx="4" fill="#00C46A"/>
    <rect x="52" y="60" width="68" height="22" rx="4" fill="#00C46A"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="278" font-family="monospace" font-size="58" font-weight="700" fill="#F0F0EE" letter-spacing="-1" text-anchor="middle">nativos<tspan fill="#00C46A">.cloud</tspan></text>

  <!-- Descriptor -->
  <text x="600" y="326" font-family="monospace" font-size="16" fill="#4A4A48" letter-spacing="2.5" text-anchor="middle">CONSULTORIA CLOUD · MSP · DEVOPS · FINOPS</text>

  <!-- Thin rule -->
  <rect x="200" y="368" width="800" height="1" fill="#1E1E1C"/>

  <!-- Cloud providers row — 4 badges -->

  <!-- AWS -->
  <rect x="202" y="394" width="182" height="80" rx="6" fill="#141412" stroke="#222220" stroke-width="1"/>
  <rect x="202" y="394" width="3" height="80" rx="2" fill="#FF9900" opacity="0.5"/>
  <text x="293" y="445" font-family="monospace" font-size="26" font-weight="700" fill="#C4C4C2" text-anchor="middle" letter-spacing="-0.5">AWS</text>
  <text x="293" y="466" font-family="monospace" font-size="10" fill="#3A3A38" letter-spacing="2" text-anchor="middle">AMAZON WEB SERVICES</text>

  <!-- Azure -->
  <rect x="406" y="394" width="182" height="80" rx="6" fill="#141412" stroke="#222220" stroke-width="1"/>
  <rect x="406" y="394" width="3" height="80" rx="2" fill="#0078D4" opacity="0.5"/>
  <text x="497" y="445" font-family="monospace" font-size="26" font-weight="700" fill="#C4C4C2" text-anchor="middle" letter-spacing="-0.5">Azure</text>
  <text x="497" y="466" font-family="monospace" font-size="10" fill="#3A3A38" letter-spacing="2" text-anchor="middle">MICROSOFT AZURE</text>

  <!-- GCP -->
  <rect x="610" y="394" width="182" height="80" rx="6" fill="#141412" stroke="#222220" stroke-width="1"/>
  <rect x="610" y="394" width="3" height="80" rx="2" fill="#4285F4" opacity="0.5"/>
  <text x="701" y="445" font-family="monospace" font-size="26" font-weight="700" fill="#C4C4C2" text-anchor="middle" letter-spacing="-0.5">GCP</text>
  <text x="701" y="466" font-family="monospace" font-size="10" fill="#3A3A38" letter-spacing="2" text-anchor="middle">GOOGLE CLOUD</text>

  <!-- OCI -->
  <rect x="814" y="394" width="182" height="80" rx="6" fill="#141412" stroke="#222220" stroke-width="1"/>
  <rect x="814" y="394" width="3" height="80" rx="2" fill="#F5C400" opacity="0.5"/>
  <text x="905" y="445" font-family="monospace" font-size="26" font-weight="700" fill="#C4C4C2" text-anchor="middle" letter-spacing="-0.5">OCI</text>
  <text x="905" y="466" font-family="monospace" font-size="10" fill="#3A3A38" letter-spacing="2" text-anchor="middle">ORACLE CLOUD</text>

  <!-- Thin rule -->
  <rect x="200" y="490" width="800" height="1" fill="#1E1E1C"/>

  <!-- Bottom domain -->
  <text x="600" y="560" font-family="monospace" font-size="13" fill="#2A2A28" letter-spacing="1" text-anchor="middle">nativos.cloud — Ponta Grossa, PR · Brasil</text>

</svg>
