<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dot grid pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.8" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    <!-- Green radial glow top-left -->
    <radialGradient id="glowLeft" cx="10%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#00C46A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0B0A" stop-opacity="0"/>
    </radialGradient>
    <!-- Green radial glow bottom-right (behind mark) -->
    <radialGradient id="glowRight" cx="88%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#00C46A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0B0A" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip for right panel overflow -->
    <clipPath id="clip">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="#0B0B0A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowLeft)"/>
  <rect width="1200" height="630" fill="url(#glowRight)"/>

  <!-- Top accent bar: 4px solid verde -->
  <rect x="0" y="0" width="1200" height="4" fill="#00C46A"/>

  <!-- === GIANT GHOST LOGOMARK (right, decorative) === -->
  <g clip-path="url(#clip)" opacity="0.055">
    <rect x="820" y="80"  width="310" height="148" rx="22" fill="#00C46A"/>
    <rect x="920" y="262" width="310" height="148" rx="22" fill="#00C46A"/>
    <rect x="1020" y="444" width="310" height="148" rx="22" fill="#00C46A"/>
  </g>
  <!-- Bright overlay of mark (partially visible) -->
  <g clip-path="url(#clip)" opacity="0.18">
    <rect x="840" y="90"  width="290" height="138" rx="20" fill="#00C46A"/>
    <rect x="940" y="272" width="290" height="138" rx="20" fill="#00C46A"/>
    <rect x="1040" y="454" width="290" height="138" rx="20" fill="#00C46A"/>
  </g>

  <!-- Vertical rule -->
  <rect x="82" y="88" width="2" height="454" fill="#00C46A" opacity="0.25"/>

  <!-- === LOGO LOCKUP === -->
  <!-- Logomark small (3 bars, ~56px tall) -->
  <g transform="translate(108, 102)">
    <rect x="0"  y="0"  width="44" height="17" rx="3.5" fill="#00C46A"/>
    <rect x="17" y="22" width="44" height="17" rx="3.5" fill="#00C46A"/>
    <rect x="34" y="44" width="44" height="17" rx="3.5" fill="#00C46A"/>
  </g>

  <!-- Wordmark -->
  <text x="176" y="137" font-family="monospace" font-size="38" font-weight="700" fill="#F0F0EE" letter-spacing="-0.5">nativos<tspan fill="#00C46A">.cloud</tspan></text>

  <!-- Divider line -->
  <rect x="108" y="166" width="440" height="1.5" fill="#00C46A" opacity="0.35"/>

  <!-- Category tag -->
  <text x="108" y="200" font-family="monospace" font-size="13" fill="#00C46A" letter-spacing="3.5" font-weight="600">CONSULTORIA CLOUD · MSP · DEVOPS</text>

  <!-- === MAIN HEADLINE === -->
  <text x="108" y="288" font-family="monospace" font-size="78" font-weight="700" fill="#F0F0EE" letter-spacing="-2">Infra que</text>
  <text x="108" y="378" font-family="monospace" font-size="78" font-weight="700" fill="#F0F0EE" letter-spacing="-2">funciona<tspan fill="#00C46A">.</tspan></text>

  <!-- Descriptor line -->
  <text x="110" y="430" font-family="monospace" font-size="18" fill="#6B6B69" letter-spacing="0.3">Migração · Operação · Escala — multi-cloud com suporte 24/7</text>

  <!-- === METRIC PILLS (bottom) === -->
  <!-- Pill 1 -->
  <rect x="108" y="480" width="174" height="62" rx="6" fill="#141412" stroke="#252523" stroke-width="1"/>
  <text x="122" y="503" font-family="monospace" font-size="9" fill="#6B6B69" letter-spacing="2">EXPERIÊNCIA</text>
  <text x="122" y="534" font-family="monospace" font-size="30" font-weight="700" fill="#00C46A">15+</text>

  <!-- Pill 2 -->
  <rect x="296" y="480" width="174" height="62" rx="6" fill="#141412" stroke="#252523" stroke-width="1"/>
  <text x="310" y="503" font-family="monospace" font-size="9" fill="#6B6B69" letter-spacing="2">ECONOMY·FINOPS</text>
  <text x="310" y="534" font-family="monospace" font-size="30" font-weight="700" fill="#00C46A">↓35%</text>

  <!-- Pill 3 -->
  <rect x="484" y="480" width="174" height="62" rx="6" fill="#141412" stroke="#252523" stroke-width="1"/>
  <text x="498" y="503" font-family="monospace" font-size="9" fill="#6B6B69" letter-spacing="2">UPTIME SLA</text>
  <text x="498" y="534" font-family="monospace" font-size="30" font-weight="700" fill="#00C46A">99.9%</text>

  <!-- === BOTTOM BAR === -->
  <rect x="0" y="602" width="1200" height="28" fill="#141412"/>
  <text x="108" y="621" font-family="monospace" font-size="12" fill="#4A4A48" letter-spacing="1">nativos.cloud</text>
  <text x="246" y="621" font-family="monospace" font-size="12" fill="#252523">·</text>
  <text x="264" y="621" font-family="monospace" font-size="12" fill="#4A4A48" letter-spacing="0.5">Ponta Grossa, PR — Brasil</text>

  <!-- Cloud stack tags (bottom right) -->
  <g font-family="monospace" font-size="11" font-weight="600">
    <rect x="860" y="609" width="40" height="16" rx="2" fill="#1A1A18"/>
    <text x="880" y="621" fill="#FF9900" text-anchor="middle">AWS</text>

    <rect x="908" y="609" width="50" height="16" rx="2" fill="#1A1A18"/>
    <text x="933" y="621" fill="#0078D4" text-anchor="middle">Azure</text>

    <rect x="966" y="609" width="40" height="16" rx="2" fill="#1A1A18"/>
    <text x="986" y="621" fill="#4285F4" text-anchor="middle">GCP</text>

    <rect x="1014" y="609" width="40" height="16" rx="2" fill="#1A1A18"/>
    <text x="1034" y="621" fill="#F5C400" text-anchor="middle">OCI</text>

    <rect x="1062" y="609" width="62" height="16" rx="2" fill="#1A1A18"/>
    <text x="1093" y="621" fill="#326CE5" text-anchor="middle">K8s</text>
  </g>
</svg>
